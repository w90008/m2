<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>محمد خالد للشروحات PS4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#08111f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{width:1100px;max-width:95%;background:rgba(255,255,255,.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:30px}
h1{text-align:center;color:#61a8ff}
.top{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.panel{background:#101826;border-radius:14px;padding:20px}
#console{background:#05080d;color:#4cff8a;height:260px;overflow:auto;padding:10px;border-radius:10px}
button{width:100%;padding:15px;border:none;border-radius:12px;background:#2d7cff;color:#fff;font-size:20px;cursor:pointer}
button:hover{background:#4790ff}
label{display:block;margin:10px 0}
.status{margin:10px 0;color:#9ac7ff}
</style>
</head>
<body>
<div class="container">
<h1>محمد خالد للشروحات PS4</h1>
<div class="status" id="UA">Running on:</div>
<div class="top">
<div class="panel">
<h2>Kernel</h2>
<form id="kernel-options">
<label><input type="radio" name="kernel" id="lapse-exploit" value="lapse" checked> Lapse</label>
<label><input type="radio" name="kernel" id="netctrl-exploit" value="netctrl"> NetCtrl</label>
<label><input type="checkbox" id="autoJbInput"> Auto Jailbreak</label>
</form>
<button id="jeilbrek">🚀 Jailbreak</button>
</div>
<div class="panel">
<h2>Console</h2>
<pre id="console">Ready. Awaiting execution...</pre>
</div>
</div>
<!-- ضع هنا ملفات المشروع الأصلية -->
<script src="src/main.js"></script>
<script src="includes/script.js"></script>
</div>
</body>
</html>
